<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uzupełnianie kodu — Kotlin Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="kod.css" />
  <link rel="stylesheet" href="../style.css" />

</head>
<body>

  <main>
    <h1 class="module-title">Uzupełnianie kodu</h1>
    <p class="module-lead">
      Wpisz brakujące słowa kluczowe (<code>fun</code>, <code>return</code>) w puste miejsca.
      Po <strong>2</strong> błędnych próbach pojawi się podpowiedź.
    </p>

    <!-- score bar -->
    <div class="score-bar">
      <span class="score-label">Punkty</span>
      <div class="score-progress">
        <div class="score-progress__fill" id="score-fill"></div>
      </div>
      <span class="score-value" id="score-value">0 / 0</span>
    </div>

    <!-- exercises injected by JS -->
    <div id="exercises"></div>

    <div class="nav-row">
      <a href="bloczki.html" class="btn btn--ghost">← Bloczki</a>
      <a href="fiszki.html"  class="btn btn--primary">Fiszki →</a>
    </div>
  </main>

  <footer class="site-footer">
    <span>Kotlin Learn © 2026</span>
    <span>Moduł 04 · Uzupełnianie kodu</span>
  </footer>

  <script src="navbar.js" defer></script>
  <script src="kod.js"></script>
   
</body>
</html>
